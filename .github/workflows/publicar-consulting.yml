name: Publicar Consulting

# Cada vez que cambia el código de Consulting en main, arma la página
# y reemplaza la carpeta consulting/ que publica GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "consulting-app/**"
      - ".github/workflows/publicar-consulting.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-consulting
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: consulting-app/package-lock.json
      - name: Armar la página
        working-directory: consulting-app
        run: |
          npm ci
          npm run build
      - name: Reemplazar consulting/
        run: |
          rm -rf consulting
          cp -r consulting-app/out consulting
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add consulting
          if git diff --cached --quiet; then
            echo "Sin cambios en consulting/"
          else
            git commit -m "Publicar Consulting desde consulting-app"
            git push
          fi
